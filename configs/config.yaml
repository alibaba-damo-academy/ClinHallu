# Judge models are a smaller pool and can use a dedicated endpoint.
judge_registry:
  qwen3.5-plus:
    model_name: qwen3.5-plus
  qwen3.5-27b:
    model_name: qwen3.5-27b 
  qwen32b:
    model_name: qwen32b

report:
  model: qwen3.5-27b
  num_workers: 8
  retry_sleep_seconds: 5

gold_filter:
  judge_model: qwen3.5-9b-local
  num_workers: 16

generation:
  num_workers: 16
  max_samples: null
  require_reasoning: false
  timeout: 240
  max_tokens: 4096
  temperature: 0.7
  top_p: 0.9
  retry_attempts: 50

judge:
  num_workers: 8
  max_samples: null
  timeout: 60
  max_tokens: 4096
  temperature: 0.01
  top_p: 0.9
  retry_attempts: 5

replace:
  num_workers: 16
  experiments:
    - replace_vr
    - replace_kr
    - replace_vr_kr

model_downloads:
  cache_root: /model_cache
  state_file: .model_cache/.download_state.json
  max_rounds: 12
  retry_sleep_seconds: 30
  per_model_attempts: 4
  task_defaults:
    mode: download
    revision: main
  models:
    - name: lingshu-7b
      repo_id: lingshu-medical-mllm/Lingshu-7B
      cache_subdir: lingshu-7b
    - name: Qwen3.5-27B
      repo_id: Qwen/Qwen3.5-27B
      cache_subdir: Qwen3.5-27B
    - name: Qwen3.5-9B
      repo_id: Qwen/Qwen3.5-9B
      cache_subdir: Qwen3.5-9B
    - name: internvl3.5-8b
      repo_id: OpenGVLab/InternVL3_5-8B-Instruct
      cache_subdir: InternVL3_5-8B
    - name: medgemma-4b-it
      repo_id: google/medgemma-4b-it
      cache_subdir: medgemma-4b-it
    - name: qwen3-vl-8b-instruct
      repo_id: Qwen/Qwen3-VL-8B-Instruct
      cache_subdir: qwen3-vl-8b-instruct
    - name: qwen3-vl-32b-instruct
      repo_id: Qwen/Qwen3-VL-32B-Instruct
      cache_subdir: qwen3-vl-32b-instruct
    - name: qwen3.5-4b
      repo_id: Qwen/Qwen3.5-4B
      cache_subdir: qwen3.5-4b
